
- name: Launch or delete AWS EC2 instances
  hosts: local
  connection: local 
  become: true

  vars:
    instance_names:
      - mangodb
      - redis
      - mysql 
      
      - catalogue
      - user
      - cart
      - shipping
      - payment
      - frontend

  tasks:
    - name: Create EC2 instances
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        region: us-east-1
        image_id: ami-0055977a6e828a4f4
        instance_type: t3.micro
        security_group: "{{ item }}"
        state: present
        wait: true
      loop: "{{ instance_names }}"
      when: action == "create"
      register: ec2_output

    - name: Delete EC2 instances
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        region: us-east-1
        state: absent
        wait: false
      loop: "{{ instance_names }}"
      when: action == "delete"
