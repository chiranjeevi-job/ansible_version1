- name: Launch an AWS EC2 instance
  hosts: localhost 
   vars: 
        instance_name: ["mongodb", "redis", "mysql", "rabbitmq", "catalogue", "user", "cart", "shipping", "payment", "frontend"]
  
  tasks:
    - name: Create EC2 instance 
     
      amazon.aws.ec2_instance:
        name: "roboshop-{{item}}"
        region: us-east-1
        image_id: ami-0055977a6e828a4f4
        instance_type: t3.micro
        security_group: "{{instance_name}}"
        state: present
        wait: true 

      loop: "{{instance_name}}"
      when: create 
      regiter: ec2_output 

    - name: delete ec2 instances
      amazon.aws.ec2_instance:
      state: absent
      name: "roboshop-{{ item }}"
      region: us-east-1
      wait: false
      loop: "{{ instances }}"
      when: action == "delete"
