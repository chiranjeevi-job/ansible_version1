
- name: Launch or delete AWS EC2 instances
  hosts: local
  connection: local 
  become: true

  vars:
    instance_names:
      - mangodb
      - redis
      - mysql 
      - catalogue
      - user
      - cart
      - shipping
      - payment
      - frontend 
    domain_name: chiranjeevidevops.space

  tasks:
    - name: Create EC2 instances
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        region: us-east-1
        image_id: ami-0055977a6e828a4f4
        instance_type: t3.micro
        security_group: "{{ item }}"
        state: present
        wait: true
      loop: "{{ instance_names }}"
      when: action == "create"
      register: ec2_output 

    - name: print ec2 creation output
      debug:
        msg: "{{ ec2_output }}"


    - name: Delete EC2 instances
      amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        region: us-east-1
        state: absent
        wait: false
      loop: "{{ instance_names }}"
      when: action == "delete"


    - name: Add record in route53 replicated
      amazon.aws.route53:
       state: present
       zone: "{{ domain_name }}"
       record: "{{ item.item }}.{{ domain_name }}" 
       type: A
       ttl: 1
       value: "{{ item.instances[0].private_ip_address }}"
      loop: "{{ ec2_output.results }}" 
      when: action == "create" 


    - name: create R53 record for frontend
      amazon.aws.route53:
       state: present
       zone: "{{ domain_name }}"
       record: "{{ domain_name }}" # daws92s.store points to frontend public IP
       type: A
       ttl: 1
       value: "{{ item.instances[0].public_ip_address }}"
       overwrite: true
      loop: "{{ ec2_output.results }}"
      when: action == "create" and item.item == "frontend"

    - name: delete R53 records
      amazon.aws.route53:
       state: absent
       zone: "{{ domain_name }}"
       record: "{{ item }}.{{ domain_name }}"
       ttl: 1
       type: A
      loop: "{{ instances }}"
      when: action == "delete"

    - name: delete R53 record for frontend
      amazon.aws.route53:
       state: absent
       zone: "{{ domain_name }}"
       record: "{{ domain_name }}"
       ttl: 1
       type: A
      when: action == "delete" 